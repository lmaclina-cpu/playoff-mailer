<html><head><link rel="stylesheet" href="base.css"><style>:root{--w:800px;--h:600px}
.c{width:700px;padding:36px 40px}
.k{font-size:26px;font-weight:600;color:var(--gris)}
.pill{display:inline-flex;align-items:center;gap:12px;margin:12px 0 28px;background:#dcfce7;color:#15803d;font-size:36px;font-weight:700;padding:14px 26px;border-radius:999px;letter-spacing:-.01em}
.pill i{width:18px;height:18px;border-radius:50%;background:#16a34a}
.it{display:flex;align-items:center;gap:20px;font-size:34px;font-weight:600;padding:14px 0;border-top:2px solid var(--linea)}
.ok{width:44px;height:44px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center;flex:none}
.pe{width:44px;height:44px;border-radius:50%;border:4px dashed #cbd2dc;flex:none}
.it em{margin-left:auto;font-style:normal;font-size:24px;color:var(--gris);font-weight:500}
.it.p{color:#9ca3af}
body{background:#fff}.card{box-shadow:none;border-radius:0}.c{zoom:1.14;width:700px!important}
</style></head><body>
<div class="card c">
 <div class="k">Estado del pedido</div>
 <div class="pill"><i></i>Parcialmente entregado</div>
 <div class="it"><span class="ok"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></span>Camiseta<em>Enviado</em></div>
 <div class="it"><span class="ok"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></span>Sudadera<em>Enviado</em></div>
 <div class="it p"><span class="pe"></span>Mochila<em>Pendiente</em></div>
</div></body></html>
