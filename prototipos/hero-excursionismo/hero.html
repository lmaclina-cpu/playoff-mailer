<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Hero del email de excursionismo. Se renderiza a 592×414 con escala 2 (1184×828) con render.cjs. -->
<style>
  :root{--azul:#006BEE;--tinta:#0B0B0C;--gris:#6B6E75;--linea:#ECEDF0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:592px;height:414px;background:#FFFFFF;font-family:Inter,Arial,sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased}
  .lienzo{position:relative;width:592px;height:414px;overflow:hidden}
  .foto{position:absolute;left:0;top:0;width:520px;height:354px;border-radius:16px;background:url(foto.jpg) center/cover}

  /* Ventana de cristal */
  .vidrio{position:absolute;padding:4px;border-radius:13px;background:rgba(255,255,255,.28);
    backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 8px 20px rgba(12,20,40,.14),0 1px 4px rgba(12,20,40,.08),inset 0 1px 0 rgba(255,255,255,.85)}
  .barra{display:flex;align-items:center;gap:5px;padding:3px 6px 6px;font-size:7px;line-height:9px;font-weight:500;color:rgba(255,255,255,.95);text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .barra.oscura{color:#3F4248;text-shadow:none}
  .barra i{width:4px;height:4px;border-radius:4px;background:currentColor;display:block}
  .barra span{opacity:.7;font-weight:400}
  .panel{background:#FFFFFF;border-radius:9px;overflow:hidden}

  /* Ficha del socio */
  .ficha{left:18px;top:16px;width:170px}
  .ficha h4{font-size:8.5px;line-height:11px;font-weight:600;padding:8px 10px 7px;border-bottom:1px solid var(--linea)}
  .ficha .sub{font-size:6.5px;line-height:8px;color:var(--gris);padding:0 10px 7px;border-bottom:1px solid var(--linea)}
  .fila{padding:5px 10px;border-bottom:1px solid var(--linea);font-size:6.5px;line-height:8px}
  .fila:last-child{border-bottom:0}
  .fila dt{color:var(--gris)}
  .fila dd{font-size:7.5px;line-height:10px;font-weight:600;margin-top:2px}
  .fila dd small{font-weight:400;color:var(--gris)}

  /* Actividad */
  .actividad{right:22px;top:12px;width:190px}
  .tarjeta{display:flex;gap:8px;padding:7px;align-items:center}
  .miniatura{width:58px;height:58px;border-radius:7px;background:url(miniatura.jpg) center/cover;flex:none}
  .tarjeta h3{font-size:8.5px;line-height:10px;font-weight:600;margin-bottom:4px}
  .dato{display:flex;align-items:center;gap:3px;font-size:6.5px;line-height:8px;color:#3F4248;margin-bottom:3px}
  .dato b{color:var(--tinta)}
  .dato svg{width:8px;height:8px;flex:none}
  .boton{display:inline-block;margin-top:3px;font-size:6.5px;line-height:8px;font-weight:500;padding:4px 9px;border-radius:999px;background:var(--azul);color:#FFFFFF}

  /* Cuotas */
  .cuotas{left:168px;bottom:24px;width:226px}
  table{width:100%;border-collapse:collapse;font-size:6.8px;line-height:8px}
  th{font-weight:600;text-align:left;padding:7px 8px 6px;border-bottom:1px solid var(--linea)}
  td{padding:5px 8px;border-bottom:1px solid var(--linea);white-space:nowrap;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  .num{text-align:right}
  .chip{display:inline-block;font-size:6px;line-height:7px;font-weight:600;padding:2px 4px;border-radius:3px;color:#FFFFFF}
  .pagado{background:#2E9D57}
  .pendiente{background:#FFF1D6;color:#9A5B00}
</style>
</head>
<body>
<div class="lienzo">
  <div class="foto"></div>

  <!-- Ficha del socio -->
  <div class="vidrio ficha">
    <div class="barra oscura"><i></i>Ficha del socio</div>
    <div class="panel">
      <h4>Laura Puig Serra</h4>
      <dl>
        <div class="fila"><dt>Alergias</dt><dd>Frutos secos <small>· lleva EpiPen</small></dd></div>
        <div class="fila"><dt>Contacto de emergencia</dt><dd>Jordi Vila <small>· pareja</small></dd></div>
      </dl>
    </div>
  </div>

  <!-- Actividad -->
  <div class="vidrio actividad">
    <div class="barra oscura"><i></i>Próxima salida</div>
    <div class="panel tarjeta">
      <div class="miniatura"></div>
      <div>
        <h3>Ruta de los lagos</h3>
        <p class="dato"><svg viewBox="0 0 24 24" fill="none" stroke="#006BEE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><b>14 mar · 07:30</b></p>
        <p class="dato"><svg viewBox="0 0 24 24" fill="none" stroke="#006BEE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.8-3.3 3.2-5 6-5s5.2 1.7 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2c2.4.2 4 1.8 4.5 4.8"/></svg>Quedan <b>8 plazas</b></p>
        <span class="boton">Inscribirme</span>
      </div>
    </div>
  </div>

  <!-- Cuotas -->
  <div class="vidrio cuotas">
    <div class="barra"><i></i>Cuota anual 2027</div>
    <div class="panel">
      <table>
        <tr><th>Socio</th><th>Estado</th><th class="num">Importe</th></tr>
        <tr><td>Puig Serra</td><td><span class="chip pagado">Pagado</span></td><td class="num">45 €</td></tr>
        <tr><td>Ferrer Casals</td><td><span class="chip pendiente">Pendiente</span></td><td class="num">45 €</td></tr>
      </table>
    </div>
  </div>
</div>
</body>
</html>
