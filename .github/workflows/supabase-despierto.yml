# Supabase pausa los proyectos gratis que llevan una semana sin uso.
# Esto le hace una consulta mínima cada día para que no se duerma.
# Necesita dos secretos en GitHub (Settings → Secrets and variables → Actions):
# SUPABASE_URL y SUPABASE_KEY, los mismos que en Render.
name: Supabase despierto
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Faltan los secretos SUPABASE_URL y SUPABASE_KEY"; exit 1
          fi
          curl -fsS -o /dev/null -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/envios?select=id&limit=1"
